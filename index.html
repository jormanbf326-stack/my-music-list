<style>

body{background:#0f0f11;color:#e8e8e8;padding:12px;padding-bottom:120px;}

.ctrl{display:flex;gap:10px;margin-bottom:14px;}
.ctrl button{flex:1;padding:12px 0;border:0;border-radius:8px;background:#3955dd;color:#fff;font-size:16px;}
h2{font-size:18px;margin:10px 0;}
.item{padding:12px 10px;margin:6px 0;background:#1b1b24;border-radius:8px;font-size:15px;cursor:pointer;}
.item.active{background:#303468;color:#c8d6ff;}

let cur = 0;
const iframe = document.getElementById('iframePlayer');
const lyricTitle = document.getElementById('lyricTitle');
const lyricText = document.getElementById('lyricText');
const listDom = document.getElementById('songList');

function renderList(){
  listDom.innerHTML = '';
  songs.forEach((s,i)=>{
    const div = document.createElement('div');
    div.className = 'item' + (i===cur?' active':'');
    div.innerText = s.title;
    div.onclick = ()=>play(i);
    listDom.appendChild(div);
  })
}

function play(idx){
  cur = idx;
  const s = songs[cur];
  iframe.src = `https://player.bilibili.com/player.html?bvid=${s.bv}&danmaku=0&autoplay=0`;
  lyricTitle.innerText = s.title;
  lyricText.innerText = s.lyric;
  renderList();
}
function nextSong(){
  cur = (cur+1) % songs.length; play(cur);
}
function prevSong(){
  cur = (cur -1 + songs.length) % songs.length; play(cur);
}
renderList();
